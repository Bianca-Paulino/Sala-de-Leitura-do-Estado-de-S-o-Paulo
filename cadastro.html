<!DOCTYPE html>
<html lang="pt-BR">
    <head>
       <meta charset="UTF-8">

       <meta name="viewport" content="width=device-width, initial-scale=1.0">

       <link rel="stylesheet" href="style.css">

        <title>Cadastro de Livros</title>

    </head>

<body>
    <header>
        <h1>Canto de Leitura</h1>

           <nav>
            <a href="index.html">Voltar a página inicial</a>
            <a href="#">Explorar gêneros</a>
            <a href="emprestimos.html">Livros alugados</a>
           </nav>
    </header>

<main>
    <form>
        <label>
            Título do livro:
            <input type="text" placeholder="Ex: Dom Casmurro">
        </label>

    <div>   
        <label>
            Autor:
            <input type="text" placeholder="Ex: Machado de Assis">
        </label>
    </div> 

    <div>   
        <label>
            Link da capa:
            <input type="url" placeholder="Link da capa">
        </label>
    </div> 

    <div>
        <label>
            Envie a foto da capa:
            <input type="file" accept="image/*">
        </label>
    </div> 

    <div>
        <label>
            Quantidade de cópias:
            <input type="number" placeholder="Ex: 2">
        </label>
    </div> 

        <div>
            <button type="submit">Cadastrar Livro</button>
        </div>

    </form>
</main>

</body>

</html>
